[workspace]
resolver = "2"
# cargo-fuzz builds this crate on its own, with sanitizer flags the workspace
# must not inherit, so it is not a member.
exclude = ["fuzz"]
members = [
    "crates/impact-core",
    "crates/impact-cli",
    "crates/impact-bench",
    "bindings/python",
    "bindings/node",
    "bindings/wasm",
    "bindings/c",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wickra-lib/wickra-impact"
authors = ["wickra-lib"]

[workspace.dependencies]
# Workspace-internal core, referenced by the CLI, bench and bindings.
wickra-impact-core = { version = "0.1.0", path = "crates/impact-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = "1"
thiserror = "2"
rayon = "1"
clap = { version = "4", features = ["derive"] }
# Held at the same major as the copy `wickra-backtest` resolves, so the tree
# carries one `wickra-core` and one set of indicator types rather than two that
# share none at all.
wickra-core = "1.0"
wickra-data = "1.0"
# The backtest engine IMPACT inherits: StrategySpec, RunRequest, BacktestReport,
# the OrderBook/Level types and the streaming engine. IMPACT replaces only the
# fill stage.
wickra-backtest = "0.1.4"
# Historical L2 order books IMPACT walks; used behind the `live` feature.
wickra-exchange = "0.1.3"
cbindgen = "0.27"
criterion = { package = "codspeed-criterion-compat", version = "5.0.1", features = ["html_reports"] }
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
