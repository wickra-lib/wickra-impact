[package]
name = "wickra-impact"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The wickra-impact reference CLI: backtest a strategy against the real historical L2 order book."

[[bin]]
name = "wickra-impact"
path = "src/main.rs"

[package.metadata.docs.rs]
# Document every feature so an optional surface is not missing from the
# reference. docs.rs builds on nightly and sets the `docsrs` cfg, which is what
# makes the feature badges appear.
all-features = true

[dependencies]
wickra-impact-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }

[lints]
workspace = true
